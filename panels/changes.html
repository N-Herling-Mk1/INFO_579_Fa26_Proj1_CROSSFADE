<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change log</title>
<link rel="icon" href="../assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/images/icon-192.png">
<link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
<link rel="stylesheet" href="../assets/site.css">
<script src="../data/site_data.js"></script>
<script src="../assets/panel.js"></script>
</head>
<body>
<div class="panel">
  <h1>Change log</h1>
  <p class="lede">How the design moved from the first draft to now: the professor's feedback, two rounds of review, and each deliverable as it landed.</p>
  <div class="toolbar"><a class="btn" href="../CHANGES.md" target="_blank" rel="noopener">View as Markdown</a></div>
  <div class="doc-layout">
    <nav class="toc" id="toc" aria-label="Sections"></nav>
    <article class="prose" id="doc"></article>
  </div>
</div>
<script>
(function () {
  var d = window.SITE.changes;
  document.getElementById("doc").innerHTML = d.html;
  var toc = document.getElementById("toc");
  d.toc.forEach(function (t) { toc.appendChild(CF.el("a", { href: "#" + t.id, text: t.name })); });
  if (location.hash) { var target = document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); }
})();
</script>
</body>
</html>
