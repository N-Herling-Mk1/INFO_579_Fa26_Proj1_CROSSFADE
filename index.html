<script>
/* CROSSFADE site shell. One page: top bar (sections), side rail (that section's pages), one iframe (the page).
   Routes: #<section>/<page>[/<anchor...>], e.g. #p2/usecases, #p1/dictionary/artist, #home/data/tables.
   Old URLs (project1/#x, project2/#x, ...) redirect here, and links inside panels that point at those old
   pages are caught and turned into routes, so the panels themselves did not have to change. */
(function () {
  var SECTIONS = {
    home: { label: "Home", ctx: "INFO 579 · SQL/NoSQL Databases · Fall 2026", groups: [
      ["", [["overview", "Overview", "home/overview.html"]]],
      ["Quick access", [["p1", "Project 1", "home/p1.html", "01", "Instructions + submission"],
                        ["data", "Project 1 data", "home/data.html", "02", "Bulk or per-table CSV"],
                        ["brief", "Project 2 brief", "home/brief.html", "03", "Assignment PDF"]]]] },
    p1: { label: "Project 1", short: "P1", sub: "Database Design", ctx: "Project 1 · Database Design", groups: [
      ["Overview", [["home", "Home", "project1/panels/home.html"]]],
      ["Deliverables", [["requirements", "Requirements analysis", "project1/panels/requirements.html", null, null, "requirements_analysis.pdf"],
                        ["conceptual", "Conceptual model", "project1/panels/conceptual.html", null, null, "conceptual_data_model.png"],
                        ["data", "Sample data", "project1/panels/data.html", null, null, "data.xlsx"],
                        ["physical", "Physical model", "project1/panels/physical.html", null, null, "physical_data_model.png"],
                        ["physical_mk1", "↳ mk1 draft", "project1/panels/physical_mk1.html"]]],
      ["Reference", [["dictionary", "Data dictionary", "project1/panels/dictionary.html"],
                     ["changes", "Change log", "project1/panels/changes.html"],
                     ["files", "Files", "project1/panels/files.html"]]]] },
    p2: { label: "Project 2", short: "P2", sub: "SQL Database", ctx: "Project 2 · SQL Database", groups: [
      ["Overview", [["overview", "Deliverables", "project2/panels/overview.html"],
                    ["rubric", "Rubric", "project2/panels/rubric.html"],
                    ["usecases", "Use cases", "project2/panels/usecases.html"]]],
      ["Files", [["implementation", "database_implementation", "project2/panels/file.html?f=implementation"],
                 ["single", "single_table", "project2/panels/file.html?f=single"],
                 ["multiple", "multiple_table", "project2/panels/file.html?f=multiple"],
                 ["routines", "routines", "project2/panels/file.html?f=routines"]]],
      ["Vetting & tests", [["vet-implementation", "database_implementation", "project2/panels/vetting.html?f=implementation", null, "228 tests"],
                           ["vet-single", "single_table", "project2/panels/vetting.html?f=single", null, "67 tests"],
                           ["vet-multiple", "multiple_table", "project2/panels/vetting.html?f=multiple", null, "80 tests"],
                           ["vet-routines", "routines", "project2/panels/vetting.html?f=routines", null, "50 tests"]]],
      ["Reference", [["brief", "Assignment brief", "project2/panels/brief.html"]]]] },
    p3: { label: "Project 3", short: "P3", sub: "NoSQL Database", ctx: "Project 3 · NoSQL Database", groups: [
      ["", [["overview", "Overview", "project3/panel.html"]]]] },
    design: { label: "Design", sub: "All projects", ctx: "Top-level design", groups: [
      ["", [["overview", "Top-level design", "design/panel.html"]]]] },
    history: { label: "History", sub: "Provenance", ctx: "Project history and provenance", groups: [
      ["", [["overview", "Provenance", "history/panel.html"]]]] }
  };
  var ORDER = ["home", "p1", "p2", "p3", "design", "history"];
  var FOLDER = { project1: "p1", project2: "p2", project3: "p3", design: "design", history: "history" };
  var LEGACY_HOME = { p1: 1, data: 1, brief: 1 };          // old front-page views: #p1, #data/..., #brief

  var app = document.getElementById("app"), frame = document.getElementById("main");
  var sideNav = document.getElementById("side-nav");
  var stage = document.getElementById("stage"), veil = document.getElementById("veil"), led = document.getElementById("sh-led");
  var ctxEl = document.getElementById("tb-ctx"), hubEl = document.getElementById("side-hub");
  var DARK = { "home/overview.html": 1, "history/panel.html": 1 };                   // panels drawn dark; the rest are light reading surfaces
  var cur = { sec: null, page: null }, veilTimer = null;
  /* the panel is loaded with location.replace, not by setting the iframe's src: a src change adds an entry to the
     browser's history, so the browser's back button would step the panel instead of the page route. */
  var frameSrc = "";
  function loadFrame(src) {
    frameSrc = src;
    try { frame.contentWindow.location.replace(new URL(src, location.href).href); }
    catch (e) { frame.setAttribute("src", src); }
  }
  var backBtn = document.getElementById("tb-back"), fwdBtn = document.getElementById("tb-fwd"), histMove = null;
  var hist = { list: [], i: -1 };                                   // pages visited this session (see back / forward below)
  try { var hv = JSON.parse(sessionStorage.getItem("cf-hist")); if (hv && Array.isArray(hv.list)) hist = hv; } catch (e) {}

  function pages(sec) { var out = []; SECTIONS[sec].groups.forEach(function (g) { out = out.concat(g[1]); }); return out; }
  function page(sec, id) { return pages(sec).filter(function (p) { return p[0] === id; })[0]; }

  /* ---- top bar: one static button per section */
  var tbNav = document.getElementById("tb-nav");
  tbNav.innerHTML = ORDER.map(function (k) {
    var s = SECTIONS[k];
    return '<a class="tb-btn" href="#' + k + '" data-sec="' + k + '" title="' + s.label + ' (Alt+' + (ORDER.indexOf(k) + 1) + ')">' +
      '<span class="gl" aria-hidden="true"></span><span class="tx"><span class="l">' + s.label + '</span><span class="ls">' + (s.short || s.label) + "</span>" +
      (s.sub ? '<span class="s">' + s.sub + "</span>" : "") + "</span></a>" +
      (k === "home" ? '<span class="sh-div tb-sep" aria-hidden="true"></span>' : "");
  }).join("");

  /* ---- side rail for one section */
  function drawRail(sec) {
    sideNav.innerHTML = SECTIONS[sec].groups.map(function (g) {
      return (g[0] ? "<h2>" + g[0] + "</h2>" : "") + g[1].map(function (p) {
        var num = p[3] ? '<span class="n">' + p[3] + "</span>" : "";
        var sub = p[4] ? '<span class="sb">' + p[4] + "</span>" : "";
        return '<a class="sn" href="#' + sec + "/" + p[0] + '" data-page="' + p[0] + '"' + (p[5] ? ' data-file="' + p[5] + '"' : "") + ">" +
          num + '<span class="t">' + p[1].replace(/_/g, "_<wbr>") + sub + '</span><span class="state"></span></a>';
      }).join("");
    }).join("");
    statuses(sec);
  }
  function setState(sel, text, ok) {
    var el = sideNav.querySelector(sel + " .state"); if (!el) return;
    el.textContent = text; el.className = "state " + (ok ? "done" : "todo");
  }
  function statuses(sec) {
    if (sec === "p1" && window.SITE && window.SITE.status) {
      Array.prototype.forEach.call(sideNav.querySelectorAll("[data-file]"), function (a) {
        var ok = !!window.SITE.status[a.dataset.file]; setState('[data-page="' + a.dataset.page + '"]', ok ? "done" : "next", ok);
      });
    }
    if (sec === "p2" && window.P2) {
      var have = 0, seen = 0;
      window.P2.present("project2/", function (f, ok) {
        setState('[data-page="' + f.id + '"]', ok ? "✓" : "–", ok);
        seen++; if (ok) have++;
        if (seen === window.P2.files.length) setState('[data-page="overview"]', have + "/" + seen, have === seen);
      });
    }
  }

  /* ---- routing */
  function parse(hash) {
    var parts = hash.replace(/^#/, "").split("/").filter(Boolean);
    if (!parts.length) return { sec: "home", page: "overview", rest: [] };
    if (!SECTIONS[parts[0]]) {                               // old front-page hashes
      if (LEGACY_HOME[parts[0]]) return { sec: "home", page: parts[0], rest: parts.slice(1) };
      return { sec: "home", page: "overview", rest: [] };
    }
    var sec = parts[0], pg = parts[1] && page(sec, parts[1]) ? parts[1] : pages(sec)[0][0];
    return { sec: sec, page: pg, rest: parts[1] === pg ? parts.slice(2) : [] };
  }
  function show() {
    var r = parse(location.hash), p = page(r.sec, r.page);
    if (cur.sec !== null && window.SFX) {                 // a chime for a new section, a tap for a new page in it
      if (r.sec !== cur.sec) window.SFX.select(ORDER.indexOf(r.sec));
      else if (r.page !== cur.page) window.SFX.tap();
    }
    if (r.sec !== cur.sec) {
      drawRail(r.sec);
      Array.prototype.forEach.call(tbNav.children, function (a) { a.toggleAttribute("aria-current", a.dataset.sec === r.sec); });
      document.body.setAttribute("data-acc", r.sec);
      hubEl.textContent = SECTIONS[r.sec].short || SECTIONS[r.sec].label;
    }
    ctxEl.textContent = (SECTIONS[r.sec].short || SECTIONS[r.sec].label) + " · " + p[1].replace("↳ ", "");
    Array.prototype.forEach.call(sideNav.querySelectorAll(".sn"), function (a) { a.toggleAttribute("aria-current", a.dataset.page === r.page); });
    var src = p[2] + (r.rest.length ? "#" + r.rest.join("/") : "");
    if (frameSrc !== src) {
      var samePage = frameSrc.split("#")[0] === p[2];
      if (!samePage) veilOn();
      stage.classList.toggle("dark", !!DARK[p[2]]);
      loadFrame(src);
    }
    cur = { sec: r.sec, page: r.page };
    histNote("#" + [r.sec, r.page].concat(r.rest).join("/"));
    document.title = (r.sec === "home" && r.page === "overview" ? "" : p[1].replace("↳ ", "") + " | " + (r.sec === "home" ? "" : SECTIONS[r.sec].label + " | ")) + "CROSSFADE";
  }
  window.addEventListener("hashchange", show);

  /* ---- links inside a panel that point at an old page become routes */
  var root = location.pathname.replace(/[^\/]*$/, "");
  function routeOf(url) {
    if (url.origin !== location.origin || url.pathname.indexOf(root) !== 0) return null;
    var rel = url.pathname.slice(root.length), h = url.hash.replace(/^#/, "");
    if (rel === "" || rel === "index.html") return h || "home";
    var m = rel.match(/^(project1|project2|project3|design|history)\/(index\.html)?$/);
    return m ? FOLDER[m[1]] + (h ? "/" + h : "") : null;
  }
  function veilOn() {
    veil.classList.add("on"); led.classList.add("busy");
    clearTimeout(veilTimer); veilTimer = setTimeout(veilOff, 2500);   // never leave the veil up
  }
  function veilOff() { clearTimeout(veilTimer); veil.classList.remove("on"); led.classList.remove("busy"); }
  frame.addEventListener("load", function () {
    veilOff();
    var doc; try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc) return;
    doc.addEventListener("click", function (e) {
      var a = e.target.closest && e.target.closest("a[href]");
      if (!a || a.hasAttribute("download") || a.target === "_blank" || e.ctrlKey || e.metaKey || e.shiftKey) return;
      var r = routeOf(new URL(a.href, doc.baseURI));
      if (r === null) return;
      e.preventDefault(); location.hash = r;
    }, true);
    /* keep the address bar in step when a panel changes its own #anchor (tabs, dictionary entries) */
    frame.contentWindow.addEventListener("hashchange", function () {
      var h = frame.contentWindow.location.hash.replace(/^#/, "");
      var want = "#" + cur.sec + "/" + cur.page + (h ? "/" + h : "");
      if (location.hash !== want) history.replaceState(null, "", want);
      if (hist.list[hist.i] !== want) { hist.list[hist.i] = want; histSave(); }   // back returns to this tab / entry
      frameSrc = page(cur.sec, cur.page)[2] + (h ? "#" + h : "");   // the panel is already there: just note it
    });
  });

  /* ---- hide / show the rail. On load: the splash shows with the rail closed under the boot overlay
     (bar + %), the menu button blinks for 4 s, the ready chime plays, then the rail opens and the top bar
     settles to 80% of its height. */
  var tog = document.getElementById("rail-toggle"), bootT = null;
  /* every control is locked until the boot sequence is done: the top bar, the rail and the panel are inert
     (no clicks, no keyboard focus), and the Alt+1..6 keys wait too. The boot overlay's own Enter button and its
     click-or-key-to-continue stay live, since they are part of the boot. */
  var LOCKED = [document.querySelector(".topbar"), document.getElementById("side"), frame];
  function lock(on) { LOCKED.forEach(function (el) { if (on) el.setAttribute("inert", ""); else el.removeAttribute("inert"); }); }
  lock(true);
  function setRail(open) {
    app.classList.toggle("rail-hidden", !open);
    tog.setAttribute("aria-expanded", open ? "true" : "false");
    tog.setAttribute("aria-label", open ? "Hide the menu" : "Show the menu");
  }
  function finishBoot() {
    if (!app.classList.contains("booting")) return;
    clearTimeout(bootT);
    var bo = document.getElementById("boot");
    if (bo) { bo.classList.add("out"); setTimeout(function () { bo.hidden = true; }, 600); }
    tog.classList.remove("blink");
    app.classList.remove("booting");
    lock(false);
    setRail(true);
    document.body.classList.add("compact");
  }
  tog.addEventListener("click", function () {
    if (app.classList.contains("booting")) return;                    // locked until the boot is done
    if (window.SFX) window.SFX.tap();
    setRail(app.classList.contains("rail-hidden"));
  });
  var stillBoot = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var bootEl = document.getElementById("boot");

  /* ---- boot overlay: loading bar + %, then the ready chime */
  var Boot = (function () {
    var BOOT_MS = 4000, t0 = performance.now(), shown = 0, raf = null;
    var enter = document.getElementById("bt-enter"), hint = document.getElementById("bt-hint");
    var fill = document.getElementById("bt-fill"), pct = document.getElementById("bt-pct");
    var stepEl = document.getElementById("bt-step"), nEl = document.getElementById("bt-n");
    /* real milestones, in order; each is marked done when it actually happens */
    var M = [["Starting shell", true], ["Loading data", !!window.SITE], ["Loading fonts", false],
             ["Checking deliverables", !window.P2], ["Deploying panel", false]];
    function done(i) { M[i][1] = true; }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { done(2); }); else done(2);
    if (window.P2) {
      var seen = 0;
      window.P2.present("project2/", function () { if (++seen === window.P2.files.length) done(3); });
      setTimeout(function () { done(3); }, 6000);                 // never hang on a slow check
    }
    frame.addEventListener("load", function () { done(4); }, { once: true });
    setTimeout(function () { M.forEach(function (m) { m[1] = true; }); }, 10000);   // hard ceiling

    function frameTick() {
      var nDone = M.filter(function (m) { return m[1]; }).length;
      var timeF = Math.min(1, (performance.now() - t0) / BOOT_MS);
      var realF = nDone / M.length;
      var target = Math.min(timeF, realF) * 100;
      shown += (target - shown) * 0.18;                            // ease toward it
      if (target >= 100 && shown > 99.4) shown = 100;
      var v = Math.floor(shown);
      fill.style.width = shown.toFixed(1) + "%";
      pct.textContent = v + "%";
      bootEl.setAttribute("aria-valuenow", v);
      /* the label walks the milestones with the bar: each owns a fifth of it, and the bar never passes a
         milestone that has not happened, so the step shown is always the one being finished */
      var k = Math.min(M.length - 1, Math.floor(shown / (100 / M.length)));
      nEl.textContent = Math.min(nDone, k) + "/" + M.length;
      stepEl.textContent = v >= 100 ? "Ready" : M[k][0];
      if (v >= 100) nEl.textContent = M.length + "/" + M.length;
      if (v >= 100) { complete(); return; }
      raf = requestAnimationFrame(frameTick);
    }
    function soundAllowed() { var u = navigator.userActivation; return !u || u.hasBeenActive; }
    function go() {
      if (window.SFX) window.SFX.ready();
      window.removeEventListener("pointerdown", go, true);
      window.removeEventListener("keydown", go, true);
      finishBoot();
    }
    /* at 100%: the ready chime, then the site. A browser plays sound only after the visitor's first click or key,
       so unless one has already happened the overlay waits for Enter (or any click or key), which also unlocks the
       audio for the interface sounds that follow. With sound switched off it goes straight in. */
    function complete() {
      bootEl.classList.add("full");
      if (!window.SFX || !window.SFX.enabled()) { setTimeout(finishBoot, 250); return; }
      if (soundAllowed()) { setTimeout(go, 250); return; }
      enter.hidden = false; hint.hidden = false; bootEl.classList.add("wait");
      setTimeout(function () { try { enter.focus({ preventScroll: true }); } catch (e) {} }, 50);
      window.addEventListener("pointerdown", go, true);
      window.addEventListener("keydown", go, true);
    }
    return {
      start: function () { raf = requestAnimationFrame(frameTick); }
    };
  })();

  if (stillBoot) finishBoot();
  else { tog.classList.add("blink"); Boot.start(); }

  /* ---- sound on / off (assets/sfx.js) */
  var snd = document.getElementById("tb-snd");
  function drawSnd() {
    var on = window.SFX && window.SFX.enabled();
    snd.setAttribute("aria-pressed", on ? "true" : "false");
    snd.setAttribute("aria-label", on ? "Sound on" : "Sound off");
  }
  snd.addEventListener("click", function () {
    if (!window.SFX) return;
    var on = !window.SFX.enabled();
    if (!on) window.SFX.toggle(false);                  // say goodbye before going quiet
    window.SFX.setEnabled(on); drawSnd();
    if (on) window.SFX.toggle(true);
  });
  drawSnd();

  /* ---- back / forward: the pages visited this session, in order (kept in sessionStorage, so a reload keeps them).
     A new page drops anything ahead of the current one, as a browser does. The browser's own back and forward
     buttons move along the same list. */
  function histSave() { try { sessionStorage.setItem("cf-hist", JSON.stringify(hist)); } catch (e) {} }
  function histLabel(h) {
    var r = parse(h), p = page(r.sec, r.page);
    return (SECTIONS[r.sec].short || SECTIONS[r.sec].label) + " · " + p[1].replace("↳ ", "");
  }
  function histDraw() {
    var b = hist.i > 0 ? hist.list[hist.i - 1] : null, f = hist.i < hist.list.length - 1 ? hist.list[hist.i + 1] : null;
    backBtn.disabled = !b; fwdBtn.disabled = !f;
    backBtn.title = b ? "Back to " + histLabel(b) : "Back"; fwdBtn.title = f ? "Forward to " + histLabel(f) : "Forward";
    backBtn.setAttribute("aria-label", backBtn.title); fwdBtn.setAttribute("aria-label", fwdBtn.title);
  }
  function histNote(h) {
    if (histMove !== null && hist.list[histMove] === h) hist.i = histMove;                  // our own buttons
    else if (hist.list[hist.i] === h) { /* same entry: a reload */ }
    else if (hist.list[hist.i - 1] === h) hist.i--;                                          // the browser's back
    else if (hist.list[hist.i + 1] === h) hist.i++;                                          // the browser's forward
    else {
      hist.list = hist.list.slice(0, hist.i + 1).concat([h]);
      if (hist.list.length > 60) hist.list.shift();
      hist.i = hist.list.length - 1;
    }
    histMove = null; histSave(); histDraw();
  }
  function histGo(d) {
    var j = hist.i + d;
    if (app.classList.contains("booting") || j < 0 || j >= hist.list.length) return;
    histMove = j;
    location.hash = hist.list[j];
  }
  backBtn.addEventListener("click", function () { histGo(-1); });
  fwdBtn.addEventListener("click", function () { histGo(1); });

  /* ---- Alt+1..6 jump to a section (also forwarded from inside same-origin panels) */
  function keys(e) {
    if (!e.altKey || e.ctrlKey || e.metaKey || app.classList.contains("booting")) return;
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {           // Alt+arrows: the same back / forward list
      e.preventDefault(); histGo(e.key === "ArrowLeft" ? -1 : 1); return;
    }
    var i = parseInt(e.key, 10);
    if (i >= 1 && i <= ORDER.length) { e.preventDefault(); location.hash = ORDER[i - 1]; }
  }
  window.addEventListener("keydown", keys);
  frame.addEventListener("load", function () { try { frame.contentWindow.addEventListener("keydown", keys); } catch (e) {} });

  show();
})();
</script>
</body>
