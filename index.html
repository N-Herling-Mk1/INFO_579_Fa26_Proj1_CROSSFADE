<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROSSFADE | INFO 579 Project 1</title>
<meta name="description" content="CROSSFADE: a between-genres streaming service for independent artists. Relational database design for INFO 579, from requirements analysis to physical model.">
<link rel="stylesheet" href="assets/site.css">
<script src="data/site_data.js"></script>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <a class="wordmark" href="#home">CROSSFADE</a>
    <span class="course">INFO 579 Project 1: database design</span>
    <span class="spacer"></span>
    <a class="repo" href="https://github.com/N-Herling-Mk1/INFO_579_Fa26_Proj1_CROSSFADE">GitHub repo</a>
  </header>
  <div class="frame">
    <nav class="rail" aria-label="Project sections">
      <h2>Overview</h2>
      <button class="navbtn" data-panel="home">Home</button>
      <h2>Deliverables</h2>
      <button class="navbtn" data-panel="requirements" data-file="requirements_analysis.pdf">Requirements analysis<span class="state"></span></button>
      <button class="navbtn" data-panel="conceptual" data-file="conceptual_data_model.png">Conceptual model<span class="state"></span></button>
      <button class="navbtn" data-panel="data" data-file="data.xlsx">Sample data<span class="state"></span></button>
      <button class="navbtn" data-panel="physical" data-file="physical_data_model.png">Physical model<span class="state"></span></button>
      <h2>Reference</h2>
      <button class="navbtn" data-panel="dictionary">Data dictionary</button>
      <button class="navbtn" data-panel="changes">Change log</button>
      <button class="navbtn" data-panel="files">Files</button>
    </nav>
    <main class="viewport">
      <iframe id="view" title="Project panel" src="panels/home.html"></iframe>
    </main>
  </div>
</div>
<script>
(function () {
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".navbtn"));
  var view = document.getElementById("view");
  var ids = buttons.map(function (b) { return b.dataset.panel; });
  var status = (window.SITE && window.SITE.status) || {};

  buttons.forEach(function (b) {
    var s = b.querySelector(".state");
    if (s && b.dataset.file) {
      var done = !!status[b.dataset.file];
      s.textContent = done ? "done" : "next";
      s.className = "state " + (done ? "done" : "todo");
    }
    b.addEventListener("click", function () { location.hash = b.dataset.panel; });
  });

  function show() {
    var id = location.hash.replace("#", "") || "home";
    var anchor = "";
    if (id.indexOf("/") > 0) { anchor = "#" + id.split("/")[1]; id = id.split("/")[0]; }
    if (ids.indexOf(id) < 0) id = "home";
    var src = "panels/" + id + ".html" + anchor;
    if (view.getAttribute("src") !== src) view.setAttribute("src", src);
    buttons.forEach(function (b) {
      if (b.dataset.panel === id) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    var label = buttons[ids.indexOf(id)].childNodes[0].textContent.trim();
    document.title = label + " | CROSSFADE";
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
</body>
</html>
