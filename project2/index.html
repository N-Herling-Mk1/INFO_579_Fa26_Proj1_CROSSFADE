<script>
(function () {
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".navbtn"));
  var view = document.getElementById("view");
  var ids = buttons.map(function (b) { return b.dataset.panel; });
  var FILES = ["implementation", "single", "multiple", "routines"];
  var P = window.P2;
  if (P) {
    var have = 0, seen = 0;
    P.present("", function (f, ok) {
      var s = document.querySelector('.state[data-file="' + f.file + '"]');
      s.textContent = ok ? "\u2713" : "--";
      s.className = "state " + (ok ? "done" : "todo");
      seen++; if (ok) have++;
      if (seen === P.files.length) {
        var a = document.getElementById("st-all");
        a.textContent = have + "/" + seen;
        a.className = "state " + (have === seen ? "done" : "todo");
      }
    });
  }
  buttons.forEach(function (b) {
    b.addEventListener("click", function () { location.hash = b.dataset.panel; });
  });
  function show() {
    var id = location.hash.replace("#", "") || "overview";
    if (ids.indexOf(id) < 0) id = "overview";
    var src = FILES.indexOf(id) >= 0 ? "panels/file.html?f=" + id : "panels/" + id + ".html";
    if (view.getAttribute("src") !== src) view.setAttribute("src", src);
    buttons.forEach(function (b) {
      if (b.dataset.panel === id) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    var label = buttons[ids.indexOf(id)].childNodes[0].textContent.trim();
    document.title = label + " | Project 2 | CROSSFADE";
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
