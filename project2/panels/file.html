<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliverable</title>
<link rel="icon" href="../../assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32.png">
<link rel="stylesheet" href="../../assets/site.css?v=3f1e8bb3">
<script src="../data/deliverables.js"></script>
</head>
<body>
<div class="panel">
  <p class="group-line" id="kicker"></p>
  <h1 id="name"></h1>
  <p class="lede" id="title"></p>
  <p class="prose" id="summary" hidden></p>

  <h2>Requirements</h2>
  <ul class="prose" id="reqs"></ul>

  <div id="test" hidden>
    <h2>Test it locally</h2>
    <ol class="prose" id="test-steps"></ol>
  </div>

  <div id="results" hidden>
    <h2>Latest test run</h2>
    <p class="note" id="res-summary"></p>
    <div id="res-body"></div>
  </div>

  <h2>Script</h2>
  <div id="script">
    <div class="callout pending">
      <p><b>Not started.</b> Nothing in <code id="path"></code> yet.</p>
    </div>
  </div>
</div>
<script>
(function () {
  var P = window.P2;
  var id = new URLSearchParams(location.search).get("f");
  var f = P.files.filter(function (x) { return x.id === id; })[0] || P.files[0];
  document.title = f.file;
  document.getElementById("kicker").textContent = f.task + " · " + f.weight + "% · due " + P.due;
  document.getElementById("name").textContent = f.file;
  document.getElementById("title").textContent = f.title;
  document.getElementById("path").textContent = "project2/deliverables/" + f.file;
  document.getElementById("reqs").innerHTML = f.reqs.map(function (r) { return "<li>" + r + "</li>"; }).join("");
  if (f.summary) { var sm = document.getElementById("summary"); sm.textContent = f.summary; sm.hidden = false; }
  var url = "../deliverables/" + f.file;
  fetch(url, { cache: "no-store" }).then(function (r) {
    if (!r.ok) return;
    return r.text().then(function (sql) {
      var box = document.getElementById("script");
      box.innerHTML = '<div class="toolbar"><a class="btn" download></a><span class="note"></span></div><div class="prose"><pre><code></code></pre></div>';
      var a = box.querySelector("a"); a.href = url; a.textContent = "Download " + f.file; a.className = "btn primary";
      if (f.test) {
        document.getElementById("test-steps").innerHTML = f.test.map(function (t) { return "<li>" + t + "</li>"; }).join("");
        document.getElementById("test").hidden = false;
        var top = document.createElement("div"); top.className = "toolbar";
        top.innerHTML = '<a class="btn primary" download></a><a class="btn" download></a>';
        if (f.bundle) {
          top.firstChild.href = f.bundle;
          top.firstChild.textContent = "Download " + f.file + " + tests, rubric, use cases";
          top.firstChild.title = f.bundle.split("/").pop() + ": everything the unit tests need to run locally";
          top.lastChild.href = url; top.lastChild.textContent = f.file + " only";
        } else {
          top.firstChild.href = url; top.firstChild.textContent = "Download " + f.file; top.removeChild(top.lastChild);
        }
        document.getElementById("title").after(top);
      }
      box.querySelector(".note").textContent = sql.split("\n").length + " lines";
      box.querySelector("code").textContent = sql;
    });
  }).catch(function () {});

  /* latest test run, written by project2/tests at the end of a pytest run */
  if (f.results) {
    var sc = document.createElement("script");
    sc.src = "../data/" + f.results + "?t=" + Date.now();
    sc.onload = function () { var R = window[f.resultsVar || "P2_SINGLE"]; if (R) showResults(R); };
    document.head.appendChild(sc);
  }
  function esc(v) { return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function showResults(R) {
    var ok = R.failed === 0;
    document.getElementById("res-summary").innerHTML =
      '<span class="mark ' + (ok ? "done" : "partial") + '">' + R.passed + " passed" + (R.failed ? ", " + R.failed + " failed" : "") +
      "</span> &nbsp;run " + esc(R.generated.replace("T", " ")) + ". Each query's result below is the one the tests checked.";
    var fileTests = (R.tests.file || []);
    var h = "";
    Object.keys(R.queries).sort(function (a, b) { return (a[0] === b[0] ? 0 : a[0] === "S" ? -1 : 1) || (+a.slice(1) - +b.slice(1)); }).forEach(function (tag) {
      var q = R.queries[tag], ts = R.tests[tag] || [];
      var bad = ts.filter(function (t) { return t.outcome !== "passed"; }).length;
      if (q.kind === "expected_error") {
        var got = String(q.got || "").replace(/entry '.*' for key/, "entry '\u2026' for key");
        h += '<div class="res-q res-err"><div class="res-head"><b>[' + tag + "] " + esc(q.table || "") + " \u00b7 expected error</b> " +
          (q.use_cases || []).map(function (u) { return '<span class="chip">' + u + "</span>"; }).join("") +
          '<span class="mark ' + (bad ? "partial" : "done") + '">' + (bad ? "not refused" : "refused as expected") + "</span></div>" +
          '<p class="res-question">' + esc(q.question || "") + "</p>" +
          '<p class="note">expects <code>' + esc(q.expects) + "</code> &middot; MySQL said <code>" + esc(got) + "</code></p>" +
          '<div class="prose"><pre><code>' + esc(q.sql) + "</code></pre></div>" +
          '<p class="note">Run inside a transaction that is rolled back; the test also checks <code>' + esc(q.table) + "</code> is unchanged. Source: the end of <code>single_table.sql</code>, kept DISABLED (commented out) so the file runs clean; the test runs it on its own.</p></div>";
        return;
      }
      h += '<div class="res-q"><div class="res-head"><b>[' + tag + "] " + esc(q.table || q.title || "") + "</b> " +
        (q.use_cases || []).map(function (u) { return '<span class="chip">' + u + "</span>"; }).join("") +
        (q.declared || []).map(function (r) { return '<span class="chip g">(' + r + ")</span>"; }).join("") +
        (q.requirement ? '<span class="chip g">' + esc(q.requirement) + "</span>" : "") +
        '<span class="mark ' + (bad ? "partial" : "done") + '">' + (ts.length - bad) + "/" + ts.length + " tests</span></div>" +
        '<p class="res-question">' + esc(q.question || "") + "</p>" +
        (Array.isArray(q.columns) ? '<p class="note">reads: ' + q.columns.map(function (c) { return "<code>" + c + "</code>"; }).join(" ") + "</p>"
          : q.columns ? '<p class="note">reads: ' + Object.keys(q.columns).map(function (t) {
              return "<code>" + t + "</code> (" + q.columns[t].map(function (c) { return "<code>" + c + "</code>"; }).join(" ") + ")"; }).join(" &middot; ") + "</p>" : "");
      if (q.columns_out && q.rows) {
        h += '<div class="tablewrap res-table"><table class="grid"><thead><tr>' + q.columns_out.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") +
          "</tr></thead><tbody>" + q.rows.map(function (r) {
            return "<tr>" + r.map(function (v) { return v === null ? '<td class="null">NULL</td>' : "<td" + (/^-?\d+(\.\d+)?$/.test(v) ? ' class="num"' : "") + ">" + esc(v) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table></div>";
      }
      if (bad) h += '<p class="note">failed: ' + ts.filter(function (t) { return t.outcome !== "passed"; }).map(function (t) { return "<code>" + esc(t.test) + "</code>"; }).join(" ") + "</p>";
      h += "</div>";
    });
    var behaviour = Object.keys(R.tests).filter(function (k) { return k === "file"; }).length ? fileTests : [];
    if (behaviour.length) {
      h += '<div class="res-q"><div class="res-head"><b>Behaviour and whole-file tests</b></div><ul class="res-list">' +
        behaviour.map(function (t) { return "<li>" + (t.outcome === "passed" ? "\u2713 " : "\u2717 ") + esc(t.test.replace(/^test_/, "").replace(/_/g, " ")) + "</li>"; }).join("") + "</ul></div>";
    }
    document.getElementById("res-body").innerHTML = h;
    document.getElementById("results").hidden = false;
  }
})();
</script>
</body>
</html>
