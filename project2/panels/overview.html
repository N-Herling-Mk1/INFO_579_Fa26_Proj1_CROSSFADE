<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deliverables</title>
<link rel="icon" href="../../assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/images/favicon-32.png">
<link rel="stylesheet" href="../../assets/site.css?v=cb25b6e1">
<script src="../data/deliverables.js"></script>
<style>
  /* download column: icon buttons, live once the file exists in project2/deliverables/ */
  .deltable th.dl, .deltable td.dl { text-align: right; white-space: nowrap; width: 1%; }
  .dlbtn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 32px; min-width: 32px; padding: 0 7px;
    margin-left: 6px; vertical-align: middle; color: var(--cyan); background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
    font: 12px var(--mono); text-decoration: none; transition: border-color .15s, background .15s, box-shadow .15s; }
  .dlbtn svg { width: 16px; height: 16px; flex: 0 0 auto; }
  .dlbtn:hover, .dlbtn:focus-visible { border-color: var(--cyan); background: var(--cyan-wash); box-shadow: 0 0 0 3px rgba(10, 143, 196, .12); outline: none; }
  .dlbtn.off { color: #b6c2cc; background: #f6f8fa; pointer-events: none; }
  .dlbtn.lock { color: #8a98a5; background: #f6f8fa; border-style: dashed; cursor: not-allowed; }
</style>
</head>
<body>
<div class="panel">
  <h1>Deliverables</h1>
  <p class="group-line">INFO 579 &middot; Project 2 &middot; SQL Database &middot; due <span id="due"></span></p>
  <p class="lede">Four SQL scripts, each worth 25%, zipped together as <code id="zip"></code>.</p>

  <table class="deltable">
    <thead><tr><th>File</th><th>Task</th><th>Weight</th><th>Status</th><th class="dl">Download</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <h2>Every file</h2>
  <ul class="prose" id="general"></ul>
  <p class="note">From the <a href="../index.html#brief" target="_top">assignment brief</a>.</p>
</div>
<script>
(function () {
  var P = window.P2;
  if (!P) {                                   // opened outside the repo, or the data file failed to load
    document.getElementById("rows").innerHTML = '<tr><td colspan="5" class="note">Could not load <code>project2/data/deliverables.js</code>. ' +
      'Open this page through the site (<code>boot_site.ps1</code> or GitHub Pages), not as a lone file.</td></tr>';
    return;
  }
  document.getElementById("due").textContent = P.due;
  document.getElementById("zip").textContent = P.zip;
  var LOCK = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
  var ARROW = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  document.getElementById("rows").innerHTML = P.files.map(function (f) {
    var kit = (f.starter ? '<a class="dlbtn off" id="s-' + f.id + '" href="' + f.starter + '" download title="Starter kit for ' + f.file + ': every comment, no SQL, tests and input files" aria-label="Download the starter kit for ' + f.file + '">' + ARROW + 'starter</a>' : "") +
      (f.kit ? (f.kitLocked
        ? '<span class="dlbtn lock" title="Answer-key test kit: locked (kept in the repo, not downloadable here)" aria-label="Test kit locked">' + LOCK + "kit</span>"
        : '<a class="dlbtn off" id="k-' + f.id + '" href="' + f.kit + '" download title="Download the test kit for ' + f.file + '" aria-label="Download the test kit for ' + f.file + '">' + ARROW + "kit</a>") : "");
    return '<tr><td><a href="../index.html#' + f.id + '" target="_top"><code>' + f.file + '</code></a>' +
      '<span class="sub">' + f.title + '</span></td><td>' + f.task + '</td><td>' + f.weight + '%</td>' +
      '<td><span class="mark open" id="m-' + f.id + '">not started</span></td>' +
      '<td class="dl">' + kit + '<a class="dlbtn off" id="d-' + f.id + '" href="../deliverables/' + f.file + '" download title="' + f.file + ' not written yet" aria-label="Download ' + f.file + '" aria-disabled="true" tabindex="-1">' + ARROW + '</a></td></tr>';
  }).join("") +
    '<tr><td><code>' + P.zip + '</code><span class="sub">All four files, uploaded to D2L</span></td><td>Submit</td><td></td>' +
    '<td><span class="mark open">not built</span></td><td class="dl"></td></tr>';
  document.getElementById("general").innerHTML = P.general.map(function (g) { return "<li>" + g + "</li>"; }).join("");
  P.present("../", function (f, ok) {
    if (!ok) return;
    var m = document.getElementById("m-" + f.id);
    m.textContent = f.state || "draft"; m.className = "mark ready";
    var d = document.getElementById("d-" + f.id);
    d.className = "dlbtn"; d.title = "Download " + f.file; d.removeAttribute("aria-disabled"); d.removeAttribute("tabindex");
    var k = document.getElementById("k-" + f.id); if (k) k.className = "dlbtn";
    var st = document.getElementById("s-" + f.id); if (st) st.className = "dlbtn";
  });
})();
</script>
</body>
</html>
