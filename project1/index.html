<script>
(function () {
  var buttons = Array.prototype.slice.call(document.querySelectorAll(".navbtn"));
  var view = document.getElementById("view");
  var ids = buttons.map(function (b) { return b.dataset.panel; });
  var status = (window.SITE && window.SITE.status) || {};

  buttons.forEach(function (b) {
    var s = b.querySelector(".state");
    if (s && b.dataset.file) {
      var done = !!status[b.dataset.file];
      s.textContent = done ? "done" : "next";
      s.className = "state " + (done ? "done" : "todo");
    }
    b.addEventListener("click", function () { location.hash = b.dataset.panel; });
  });

  function show() {
    var id = location.hash.replace("#", "") || "home";
    var anchor = "";
    if (id.indexOf("/") > 0) { anchor = "#" + id.split("/")[1]; id = id.split("/")[0]; }
    if (ids.indexOf(id) < 0) id = "home";
    var src = "panels/" + id + ".html" + anchor;
    if (view.getAttribute("src") !== src) view.setAttribute("src", src);
    buttons.forEach(function (b) {
      if (b.dataset.panel === id) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    var label = buttons[ids.indexOf(id)].childNodes[0].textContent.trim();
    document.title = label + " | CROSSFADE";
  }
  window.addEventListener("hashchange", show);
  show();
})();
</script>
